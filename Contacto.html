<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - FitLife Gym</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="Estilos/estilo.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="Imagenes/Logo.png" class="Logo">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="planes.html">Planes</a></li>
                    <li class="nav-item"><a class="nav-link" href="galeria.html">Galería</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>


    <main>

        <section class="bg-dark py-5">
            <div class="container">

                <div class="row justify-content-center">
                    <div class="col-lg-6">

                        <div class="card bg-black p-4 shadow">

                            <h3 class="text-center text-white mb-4">
                                <i class="bi bi-envelope-fill me-2"></i>Contáctanos
                            </h3>

                            <form>

                                <div class="mb-3">
                                    <label class="form-label text-white">
                                        <i class="bi bi-person-fill me-2"></i>Nombre
                                    </label>
                                    <input type="text" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-white">
                                        <i class="bi bi-envelope-fill me-2"></i>Correo
                                    </label>
                                    <input type="email" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-white">
                                        <i class="bi bi-chat-left-text-fill me-2"></i>Mensaje
                                    </label>
                                    <textarea class="form-control" rows="4" required></textarea>
                                </div>

                                <div class="text-center">
                                    <button type="submit" class="btn btn-warning px-4">
                                        <i class="bi bi-send-fill me-2"></i>Enviar
                                    </button>
                                </div>

                            </form>

                        </div>
                    </div>
                </div>

                <div class="row justify-content-center mt-5">
                    <div class="col-lg-6 text-center">

                        <h4 class="text-white mb-4">
                            <i class="bi bi-share-fill me-2"></i>Síguenos
                        </h4>

                        <div class="d-flex justify-content-center gap-5">

                            <a href="https://www.facebook.com/p/Fit-Life-FitnessCenter-100083231389558/" target="_blank" class="text-decoration-none text-white fs-1">
                                <i class="bi bi-facebook"></i>
                                <p class="mt-2 fs-6">Facebook</p>
                            </a>

                            <a href="https://instagram.com/gymfit.lifecenter" target="_blank" class="text-decoration-none text-white fs-1">
                                <i class="bi bi-instagram"></i>
                                <p class="mt-2 fs-6">Instagram</p>
                            </a>

                        </div>

                    </div>
                </div>

            </div>
        </section>

    </main>

    <footer class="bg-black text-white text-center py-3">
        <p class="mb-0">2026 FitLife Gym</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
